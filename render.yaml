services:
  # 1. Nexus-AI Spring Boot REST API Backend
  - type: web
    name: nexus-ai-backend
    env: docker
    dockerfilePath: ./BackEnd/Dockerfile
    dockerContext: ./BackEnd
    plan: free
    healthCheckPath: /api/projects
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev

  # 2. Nexus-AI React Frontend (Render Free Static Web Portal)
  - type: static
    name: nexus-ai-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
