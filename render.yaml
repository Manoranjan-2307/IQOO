services:
  # 1. Nexus-AI Spring Boot REST API Backend
  - type: web
    name: nexus-ai-backend
    env: docker
    dockerfilePath: ./BackEnd/Dockerfile
    dockerContext: ./BackEnd
    plan: free
    healthCheckPath: /api/projects
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev

  # 2. Nexus-AI React Frontend (Nginx Web Service)
  - type: web
    name: nexus-ai-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
